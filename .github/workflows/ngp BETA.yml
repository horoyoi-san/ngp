name: NGP BETA Monitor 12:00

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prod-monitor:
    name: Run BETA Monitor 05:10
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # Install Dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install pyyaml
          pip install discord.py

      # =====================================================
      # Run Scripts
      # =====================================================

      - name: Run BETA scripts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_1 }}
        run: |
          python "无限大/无限大 BETA.py"
          python "Ananta/Ananta BETA.py"

      # =====================================================
      # Commit Logs
      # =====================================================

      - name: Commit and Push logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p "无限大/ngp/log"

          git add "无限大/ngp/log"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update logs [skip ci]"

          git push origin HEAD:webhook