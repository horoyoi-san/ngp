name: NGP Monitor 05:10

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:

jobs:
  prod-monitor:
    name: Run Monitor 05:10
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # =====================================================
      # Install Dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install pyyaml
          pip install discord.py

      # =====================================================
      # Run Scripts
      # =====================================================

      - name: Run scripts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_1 }}

        run: |

          python "无限大/无限大 BETA.py"
          python "Ananta/Ananta BETA.py"

      # =====================================================
      # Commit Logs
      # =====================================================

      - name: Commit and Push logs
        env:
          PAT: ${{ secrets.PAT }}

        run: |

          git config --global user.email "actions@github.com"

          git config --global user.name "GitHub Actions"

          mkdir -p "无限大/ngp/log"

          git add "无限大/ngp/log"

          if ! git diff --cached --quiet; then

            git commit -m "Update logs [skip ci]"

            git push \
              https://x-access-token:${PAT}@github.com/${{ github.repository }} \
              HEAD:webhook

          else

            echo "No changes to commit"

          fi